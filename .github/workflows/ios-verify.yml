name: Verify iOS Compilation

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  check-build:
    name: Verify iOS Compilation
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app || sudo xcode-select -switch /Applications/Xcode_15.2.app || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Enforce Xcode 15 Compatibility Format
        run: |
          sed -i '' 's/objectVersion = [0-9]*/objectVersion = 56/g' TJ.xcodeproj/project.pbxproj
          sed -i '' 's/compatibilityVersion = ".*";/compatibilityVersion = "Xcode 15.0";/g' TJ.xcodeproj/project.pbxproj

      - name: Resolve Package Dependencies
        run: xcodebuild -resolvePackageDependencies -project TJ.xcodeproj -scheme TJ || true

      - name: Compile App (Simulator)
        run: |
          xcodebuild clean build \
            -project TJ.xcodeproj \
            -scheme TJ \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            BUILD_DIR="$PWD/build"

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          if [ -d "$PWD/build/Release-iphoneos/TJ.app" ]; then
            cp -r "$PWD/build/Release-iphoneos/TJ.app" Payload/
          elif [ -d "$PWD/build/Release-iphonesimulator/TJ.app" ]; then
            cp -r "$PWD/build/Release-iphonesimulator/TJ.app" Payload/
          fi
          zip -r TJ.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TJ-iOS-App
          path: TJ.ipa
